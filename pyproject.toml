[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-evidence-retrieval"
version = "0.2.0"
description = "Reproducible scientific-abstract retrieval and BEIR SciFact benchmarking"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ml = ["numpy>=1.26,<2", "torch>=2.5,<3", "transformers>=4.46,<5", "sentence-transformers>=3.3,<6"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]

[project.scripts]
evidence = "sci_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sci_evidence = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
